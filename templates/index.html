<!DOCTYPE html>
<html>
<head>
    <title>Authentication</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #1a1a2e;
            color: white;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: #16213e;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }
        .success {
            color: #4ade80;
            font-size: 24px;
        }
        .error {
            color: #f87171;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #5865F2;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        {% if success %}
            <div class="success">✅ Successfully authenticated!</div>
            <p>You can now close this page and return to Discord.</p>
        {% else %}
            <h1>🔐 Processing...</h1>
            <div class="loader"></div>
            <p>Please wait while we complete the verification process.</p>
        {% endif %}
    </div>
</body>
</html>
